<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion Rover - Camera Stream Feed</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0px !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
            background-color: #121212;
            color: #d4d4d4;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
        }

        /* Top Header & HUD */
        .camera-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #161616;
            border-bottom: 1px solid #282828;
            padding: 6px 12px;
            height: 34px;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cam-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
        }

        .cam-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #f8fafc;
            text-transform: uppercase;
        }

        .cam-badge {
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #a1a1aa;
            font-size: 9px;
            font-family: monospace;
            padding: 1px 6px;
            font-weight: 700;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-telemetry {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
            font-size: 10px;
            color: #94a3b8;
        }

        .btn-hud {
            background: #1c1c1c;
            border: 1px solid #333333;
            color: #cbd5e1;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.15s ease;
        }

        .btn-hud:hover {
            background: #282828;
            border-color: #4a4a4a;
            color: #ffffff;
        }

        .btn-hud.btn-primary {
            background: #1d4ed8;
            border-color: #2563eb;
            color: #ffffff;
        }
        .btn-hud.btn-primary:hover {
            background: #2563eb;
        }

        /* Viewport Canvas Area */
        .viewport-container {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas#camera-stream-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Overlays & Crosshairs */
        .reticle-crosshair {
            position: absolute;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            pointer-events: none;
            display: block;
        }

        .reticle-crosshair::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(56, 189, 248, 0.4);
        }

        .reticle-crosshair::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            background: rgba(56, 189, 248, 0.4);
        }

        .osd-overlay {
            position: absolute;
            bottom: 12px;
            left: 14px;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #282828;
            padding: 4px 8px;
            font-family: monospace;
            font-size: 10px;
            color: #e2e8f0;
            pointer-events: none;
        }

        .osd-status {
            position: absolute;
            top: 12px;
            right: 14px;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #282828;
            padding: 4px 8px;
            font-family: monospace;
            font-size: 9px;
            color: #38bdf8;
            pointer-events: none;
        }

        .snapshot-toast {
            position: absolute;
            top: 50px;
            right: 14px;
            background: #14532d;
            border: 1px solid #166534;
            color: #86efac;
            font-size: 10px;
            font-weight: 700;
            padding: 6px 12px;
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="camera-header">
        <div class="header-left">
            <div id="cam-live-dot" class="cam-dot"></div>
            <div id="cam-name-text" class="cam-title">MAST INTEL REALSENSE D435i</div>
            <div id="cam-role-badge" class="cam-badge">PERCEPTION / SLAM</div>
            <select id="cam-selector" class="btn-hud" style="font-family: sans-serif; cursor: pointer; padding: 2px 4px;">
                <option value="1">CAM 1: MAST RGB</option>
                <option value="2">CAM 2: MAST DEPTH</option>
                <option value="3">CAM 3: HAZCAM FL</option>
                <option value="4">CAM 4: HAZCAM FR</option>
                <option value="5">CAM 5: HAZCAM REAR</option>
                <option value="6">CAM 6: ARM WRIST</option>
                <option value="7">CAM 7: ARM ELBOW</option>
                <option value="8">CAM 8: SCI MACRO</option>
                <option value="9">CAM 9: SCI CHAMBER</option>
                <option value="10">CAM 10: DECK PANO</option>
                <option value="11">CAM 11: LAPTOP WEBCAM (TEST)</option>
                <option value="12">CAM 12: USB CAMERA (TEST)</option>
            </select>
        </div>

        <div class="header-right">
            <div class="hud-telemetry">
                <span id="hud-res">1920x1080</span>
                <span>|</span>
                <span id="hud-fps" style="color: #22c55e;">30 FPS</span>
                <span>|</span>
                <span id="hud-bitrate" style="color: #38bdf8;">12.4 Mbps</span>
            </div>
            <button id="btn-toggle-reticle" class="btn-hud">RETICLE</button>
            <button id="btn-toggle-signal" class="btn-hud">📶 SIM SIGNAL</button>
            <button id="btn-snapshot" class="btn-hud btn-primary">📸 SNAPSHOT</button>
            <button id="btn-close" class="btn-hud" onclick="window.close()">✕ CLOSE</button>
        </div>
    </header>

    <!-- Stream Viewport -->
    <main class="viewport-container">
        <canvas id="camera-stream-canvas"></canvas>
        <div id="reticle" class="reticle-crosshair"></div>

        <!-- Center NO SIGNAL Overlay: Orion Logo + Red NO SIGNAL Label -->
        <div id="no-signal-overlay" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10, 10, 10, 0.95); z-index: 20; pointer-events: none; user-select: none;">
            <img src="/logotyp_pion_white.png" onerror="this.src='logotyp_pion_white.png'" alt="Orion VI Logo" style="width: 76px; height: 76px; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));" />
            <div style="font-family: monospace, sans-serif; font-size: 16px; font-weight: 900; letter-spacing: 3px; color: #ef4444; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.6); padding: 5px 20px; border-radius: 0px !important; text-shadow: 0 0 12px rgba(239, 68, 68, 0.6);">
                NO SIGNAL
            </div>
            <div id="no-signal-reconnect" style="font-family: monospace, sans-serif; font-size: 11px; font-weight: 700; color: #94a3b8; margin-top: 10px; letter-spacing: 0.5px;">
                Attempting reconnect in 5s...
            </div>
        </div>

        <div id="osd-info" class="osd-overlay">
            <span style="color: #71717a;">UTC:</span> <span id="osd-time">--</span> |
            <span style="color: #71717a;">CODEC:</span> H.264 LOW-LATENCY
        </div>
        <div id="osd-status" class="osd-status" style="color: #ef4444;">
            DOWNLINK: NO CARRIER (0.0% PKTS)
        </div>
        <div id="snapshot-toast" class="snapshot-toast">
            ✓ SNAPSHOT LOGGED TO NOTEBOOK
        </div>
    </main>

    <script>
        const CAMERAS = [
            { id: 1, key: 'mast_rgb', alias: 'mast', name: 'Mast Intel RealSense D435i RGB', short: 'MAST RGB', resolution: '1920x1080', role: 'Perception / SLAM' },
            { id: 2, key: 'mast_depth', alias: 'depth', name: 'Mast RealSense Depth Sensor', short: 'MAST DEPTH', resolution: '1280x720', role: 'Disparity / 3D Mapping' },
            { id: 3, key: 'haz_fl', alias: 'front', name: 'Front Left Chassis Hazard Cam', short: 'HAZCAM FL', resolution: '1280x720', role: 'Mobility / Obstacle Left' },
            { id: 4, key: 'haz_fr', alias: 'fr', name: 'Front Right Chassis Hazard Cam', short: 'HAZCAM FR', resolution: '1280x720', role: 'Mobility / Obstacle Right' },
            { id: 5, key: 'haz_rear', alias: 'rear', name: 'Rear Chassis Hazard Cam', short: 'HAZCAM REAR', resolution: '1280x720', role: 'Reverse / Tether Safety' },
            { id: 6, key: 'arm_wrist', alias: 'arm', name: 'Manipulator Wrist / Gripper Cam', short: 'ARM WRIST', resolution: '1280x720', role: 'Inspection / Grasping' },
            { id: 7, key: 'arm_elbow', alias: 'elbow', name: 'Manipulator Elbow Overview Cam', short: 'ARM ELBOW', resolution: '1280x720', role: 'Kinematics / Collision Guard' },
            { id: 8, key: 'sci_macro', alias: 'macro', name: 'Science Macro Probing Cam', short: 'SCI MACRO', resolution: '1920x1080', role: 'Regolith / Drill Core' },
            { id: 9, key: 'sci_chamber', alias: 'science', name: 'Science Internal Carousel Cam', short: 'SCI CHAMBER', resolution: '1280x720', role: 'Sample Carousel / Reagents' },
            { id: 10, key: 'deck_pano', alias: 'pano', name: 'Chassis Top Deck Context Cam', short: 'DECK PANO', resolution: '1920x1080', role: 'Situational Awareness / 360' },
            { id: 11, key: 'cam_laptop_test', alias: 'test', name: 'Laptop Webcam (Test Camera)', short: 'LAPTOP CAM', resolution: '1280x720', role: 'Operator Test Feed / Webcam', isTestCam: true },
            { id: 12, key: 'cam_usb_test', alias: 'usb', name: 'USB Camera (Test Cam)', short: 'USB CAM', resolution: '1280x720', role: 'Operator Test Feed / USB', isTestCam: true }
        ];

        // Parse camera parameter from URL (?cam=1, ?cam=2, ?cam=mast, etc.)
        const params = new URLSearchParams(window.location.search);
        let camParam = params.get('cam') || '1';
        let activeCam = CAMERAS.find(c => String(c.id) === camParam || c.key.toLowerCase() === camParam.toLowerCase() || (c.alias && c.alias.toLowerCase() === camParam.toLowerCase())) || CAMERAS[0];

        const canvas = document.getElementById('camera-stream-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1280;
        canvas.height = 720;

        const titleEl = document.getElementById('cam-name-text');
        const roleEl = document.getElementById('cam-role-badge');
        const selectEl = document.getElementById('cam-selector');
        const hudRes = document.getElementById('hud-res');
        const hudFps = document.getElementById('hud-fps');
        const hudBitrate = document.getElementById('hud-bitrate');
        const osdTime = document.getElementById('osd-time');
        const reticle = document.getElementById('reticle');
        const btnReticle = document.getElementById('btn-toggle-reticle');
        const btnSnapshot = document.getElementById('btn-snapshot');
        const toast = document.getElementById('snapshot-toast');

        function setCamera(cam) {
            activeCam = cam;
            document.title = `Orion Rover - ${cam.name} Feed`;
            titleEl.textContent = cam.name.toUpperCase();
            roleEl.textContent = cam.role.toUpperCase();
            selectEl.value = String(cam.id);
            hudRes.textContent = cam.resolution;
        }

        setCamera(activeCam);

        selectEl.addEventListener('change', async (e) => {
            const chosen = CAMERAS.find(c => String(c.id) === e.target.value);
            if (chosen) {
                stopWebcam();
                hasSignal = false;
                reconnectCountdown = 5;
                setCamera(chosen);
                updateSignalUI();
                if (chosen.id === 11 || chosen.id === 12) {
                    await startWebcam();
                } else {
                    await scanFeed();
                }
            }
        });

        let showReticle = true;
        btnReticle.addEventListener('click', () => {
            showReticle = !showReticle;
            reticle.style.display = showReticle ? 'block' : 'none';
            btnReticle.style.borderColor = showReticle ? '#38bdf8' : '#333333';
        });

        btnSnapshot.addEventListener('click', () => {
            const cvs = document.getElementById('camera-stream-canvas');
            if (!cvs) return;
            let dataUrl;
            try {
                dataUrl = cvs.toDataURL('image/png');
            } catch (err) {
                console.warn('[Snapshot] Error getting data URL:', err);
                return;
            }

            // Create thumbnail for Notebook snapshot embed
            const thumbCvs = document.createElement('canvas');
            thumbCvs.width = 60;
            thumbCvs.height = 34;
            const tCtx = thumbCvs.getContext('2d');
            tCtx.drawImage(cvs, 0, 0, 60, 34);
            let thumbUrl;
            try {
                thumbUrl = thumbCvs.toDataURL('image/png');
            } catch (_) {
                thumbUrl = dataUrl;
            }

            const uuid = 'snap-' + Date.now() + '-' + Math.random().toString(36).substring(2, 9);
            const embedId = 'embed-' + Date.now();
            const now = Date.now();

            const snapItem = {
                notebookImageDomainObject: {
                    name: `${activeCam.name} Snapshot`,
                    type: 'notebookSnapshotImage',
                    identifier: { key: uuid, namespace: '' },
                    configuration: { fullSizeImageURL: dataUrl }
                },
                embedObject: {
                    bounds: { start: now - 300000, end: now },
                    createdOn: now,
                    createdBy: null,
                    cssClass: 'icon-imagery',
                    domainObject: {
                        identifier: { namespace: 'orion.taxonomy', key: `cam_${activeCam.id}` },
                        name: activeCam.name,
                        type: 'orion.camera_feed'
                    },
                    historicLink: `#/browse/orion.taxonomy:cam_${activeCam.id}`,
                    id: embedId,
                    name: activeCam.name,
                    snapshot: {
                        fullSizeImageObjectIdentifier: { key: uuid, namespace: '' },
                        thumbnailImage: { src: thumbUrl }
                    },
                    type: 'orion.camera_feed'
                }
            };

            let list = [];
            try {
                list = JSON.parse(localStorage.getItem('notebook-snapshot-storage') || '[]');
            } catch (_) {}
            list.unshift(snapItem);
            if (list.length > 10) list.pop();
            try {
                localStorage.setItem('notebook-snapshot-storage', JSON.stringify(list));
            } catch (e) {
                console.warn('[Snapshot Storage Error]', e);
            }

            // Trigger real PNG download to user's computer
            const a = document.createElement('a');
            a.download = `snapshot_${activeCam.short.toLowerCase().replace(/[^a-z0-9]/g, '_')}_${Date.now()}.png`;
            a.href = dataUrl;
            document.body.appendChild(a);
            a.click();
            a.remove();

            toast.textContent = `📸 SNAPSHOT SAVED TO NOTEBOOK & DOWNLOADED`;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        });

        // Signal State: default NO SIGNAL when offline
        let hasSignal = false;
        const orionLogo = new Image();
        orionLogo.src = '/logotyp_pion_white.png';

        const noSigOverlay = document.getElementById('no-signal-overlay');
        const liveDot = document.getElementById('cam-live-dot');
        const osdStatus = document.getElementById('osd-status');
        const btnSignal = document.getElementById('btn-toggle-signal');

        function updateSignalUI() {
            noSigOverlay.style.display = hasSignal ? 'none' : 'flex';
            liveDot.style.background = hasSignal ? '#22c55e' : '#ef4444';
            hudFps.textContent = hasSignal ? '30 FPS' : '0 FPS';
            hudFps.style.color = hasSignal ? '#22c55e' : '#ef4444';
            hudBitrate.textContent = hasSignal ? '12.4 Mbps' : '0.0 Mbps';
            hudBitrate.style.color = hasSignal ? '#38bdf8' : '#71717a';
            osdStatus.textContent = hasSignal ? 'DOWNLINK: NOMINAL (99.8% PKTS)' : 'DOWNLINK: NO CARRIER (0.0% PKTS)';
            osdStatus.style.color = hasSignal ? '#38bdf8' : '#ef4444';
            btnSignal.textContent = `📶 ${hasSignal ? 'CUT SIGNAL' : 'SIM SIGNAL'}`;
        }
        updateSignalUI();

        btnSignal.addEventListener('click', () => {
            hasSignal = !hasSignal;
            updateSignalUI();
        });

        // Webcam stream service for standalone popout window
        let webcamStream = null;
        let webcamVideo = null;
        let isWebcamActive = false;

        async function startWebcam() {
            if (isWebcamActive && webcamVideo) return true;
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('getUserMedia not supported');
                }
                let targetDeviceId = null;
                if (navigator.mediaDevices.enumerateDevices) {
                    const devices = await navigator.mediaDevices.enumerateDevices().catch(() => []);
                    const videoInputs = devices.filter(d => d.kind === 'videoinput');
                    if (activeCam.id === 12) {
                        const usbDev = videoInputs.find(d => /usb|external|uvc|webcam\s+2/i.test(d.label));
                        if (usbDev) targetDeviceId = usbDev.deviceId;
                        else if (videoInputs.length > 1) targetDeviceId = videoInputs[1].deviceId;
                    } else {
                        const builtIn = videoInputs.find(d => /integrated|internal|facetime|built-in|front|user/i.test(d.label));
                        if (builtIn) targetDeviceId = builtIn.deviceId;
                        else if (videoInputs.length > 0) targetDeviceId = videoInputs[0].deviceId;
                    }
                }
                const constraints = {
                    video: targetDeviceId
                        ? { deviceId: { exact: targetDeviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
                        : { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: (activeCam.id === 12 ? 'environment' : 'user') },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                webcamStream = stream;
                const v = document.createElement('video');
                v.setAttribute('playsinline', 'true');
                v.setAttribute('autoplay', 'true');
                v.muted = true;
                v.srcObject = stream;
                await new Promise(r => {
                    v.onloadedmetadata = () => { v.play().then(r).catch(r); };
                    setTimeout(r, 1200);
                });
                webcamVideo = v;
                isWebcamActive = true;
                hasSignal = true;
                updateSignalUI();
                return true;
            } catch (err) {
                console.warn('[Webcam Popout] Cannot start webcam:', err);
                isWebcamActive = false;
                return false;
            }
        }

        function stopWebcam() {
            if (webcamStream) {
                webcamStream.getTracks().forEach(t => { try { t.stop(); } catch(_) {} });
                webcamStream = null;
            }
            if (webcamVideo) {
                try { webcamVideo.pause(); webcamVideo.srcObject = null; } catch(_) {}
                webcamVideo = null;
            }
            isWebcamActive = false;
        }

        if (activeCam.id === 11 || activeCam.id === 12) {
            startWebcam().catch(() => {});
        }

        // Reconnect countdown and scan timer
        let reconnectCountdown = 5;
        const reconnectEl = document.getElementById('no-signal-reconnect');

        async function scanFeed() {
            if (hasSignal) return;
            if (activeCam.id === 11 || activeCam.id === 12) {
                const ok = await startWebcam();
                if (ok) {
                    hasSignal = true;
                    updateSignalUI();
                }
                return;
            }
            try {
                const res = await fetch(`/api/camera/${activeCam.id}/feed_status`).catch(() => null);
                if (res && res.ok) {
                    const data = await res.json();
                    if (data && data.online) {
                        hasSignal = true;
                        updateSignalUI();
                    }
                }
            } catch (_) {}
        }

        setInterval(async () => {
            if (hasSignal) {
                reconnectCountdown = 5;
                return;
            }

            if (reconnectCountdown <= 0) {
                reconnectCountdown = 5;
            } else {
                reconnectCountdown--;
            }

            if (reconnectEl) {
                reconnectEl.textContent = `Attempting reconnect in ${reconnectCountdown}s...`;
            }

            // At 0 app checks for signal once more from respective camera
            if (reconnectCountdown === 0) {
                await scanFeed();
            }
        }, 1000);

        // Animation / Feed generation loop
        function drawFrame() {
            const now = Date.now();
            osdTime.textContent = new Date(now).toISOString();

            if (isWebcamActive && webcamVideo && webcamVideo.readyState >= 2) {
                ctx.drawImage(webcamVideo, 0, 0, 1280, 720);

                // Top pill badge
                const isUsb = activeCam.id === 12;
                ctx.fillStyle = isUsb ? 'rgba(8, 51, 68, 0.85)' : 'rgba(6, 78, 59, 0.85)';
                ctx.fillRect(640 - 105, 12, 210, 22);
                ctx.strokeStyle = isUsb ? '#06b6d4' : '#10b981';
                ctx.lineWidth = 1;
                ctx.strokeRect(640 - 105, 12, 210, 22);
                ctx.fillStyle = isUsb ? '#67e8f9' : '#6ee7b7';
                ctx.font = 'bold 10px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(isUsb ? '● LIVE USB CAM [TEST FEED]' : '● LIVE LAPTOP WEBCAM', 640, 23);

                // Center Reticle Crosshair
                ctx.strokeStyle = isUsb ? 'rgba(6, 182, 212, 0.4)' : 'rgba(16, 185, 129, 0.4)';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(640 - 30, 360); ctx.lineTo(640 - 8, 360);
                ctx.moveTo(640 + 8, 360); ctx.lineTo(640 + 30, 360);
                ctx.moveTo(640, 360 - 30); ctx.lineTo(640, 360 - 8);
                ctx.moveTo(640, 360 + 8); ctx.lineTo(640, 360 + 30);
                ctx.stroke();

                requestAnimationFrame(drawFrame);
                return;
            }

            if (!hasSignal) {
                // Procedural No Signal Scene: Uniform authentic Orion Logo standby for all cameras
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, 1280, 720);

                ctx.strokeStyle = '#181818';
                ctx.lineWidth = 1;
                for (let x = 0; x < 1280; x += 40) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 720); ctx.stroke();
                }
                for (let y = 0; y < 720; y += 40) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1280, y); ctx.stroke();
                }

                if (orionLogo.complete && orionLogo.naturalWidth > 0) {
                    ctx.drawImage(orionLogo, 640 - 50, 360 - 90, 100, 100);
                }

                // Red NO SIGNAL badge box
                ctx.fillStyle = 'rgba(239, 68, 68, 0.12)';
                ctx.fillRect(640 - 90, 360 + 24, 180, 32);
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
                ctx.lineWidth = 1.2;
                ctx.strokeRect(640 - 90, 360 + 24, 180, 32);

                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('NO SIGNAL', 640, 360 + 40);

                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 12px monospace';
                ctx.fillText(`Attempting reconnect in ${reconnectCountdown}s...`, 640, 360 + 74);

                requestAnimationFrame(drawFrame);
                return;
            }

            // Background terrain & sky
            ctx.fillStyle = '#1e1b18';
            ctx.fillRect(0, 0, 1280, 720);

            const groundGrad = ctx.createLinearGradient(0, 360, 0, 720);
            groundGrad.addColorStop(0, '#7c2d12');
            groundGrad.addColorStop(1, '#451a03');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, 360, 1280, 360);

            const skyGrad = ctx.createLinearGradient(0, 0, 0, 360);
            skyGrad.addColorStop(0, '#1c1917');
            skyGrad.addColorStop(1, '#78350f');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, 1280, 360);

            if (activeCam.id === 1) {
                // RealSense Mast RGB
                ctx.strokeStyle = 'rgba(251, 146, 60, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(0, 360);
                ctx.lineTo(1280, 360);
                ctx.stroke();

                ctx.fillStyle = '#b45309';
                ctx.fillRect(450, 420, 60, 40);
                ctx.fillRect(780, 390, 80, 50);

                ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
                for (let x = 0; x < 1280; x += 80) {
                    ctx.beginPath();
                    ctx.moveTo(x, 360);
                    ctx.lineTo(x + (x - 640) * 0.8, 720);
                    ctx.stroke();
                }
            } else if (activeCam.id === 2) {
                // Mast Depth Pointcloud
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, 1280, 720);
                for (let r = 0; r < 12; r++) {
                    for (let c = 0; c < 20; c++) {
                        const depth = Math.sin((c * 0.4) + (now * 0.002)) * Math.cos((r * 0.5));
                        ctx.fillStyle = `hsla(${180 + depth * 90}, 85%, 45%, 0.7)`;
                        ctx.fillRect(c * 64 + 2, r * 60 + 2, 60, 56);
                    }
                }
                ctx.fillStyle = '#38bdf8';
                ctx.font = '16px monospace';
                ctx.fillText('STEREO DEPTH POINTCLOUD: 1.84m CLOUD DENSITY', 400, 40);
            } else if (activeCam.id === 3) {
                // Front Chassis HazCam FL
                ctx.fillStyle = '#181818';
                ctx.fillRect(60, 420, 240, 300);
                ctx.strokeStyle = '#22c55e';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(180, 570, 120, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = '#22c55e';
                ctx.font = '16px monospace';
                ctx.fillText('FRONT CHASSIS HAZCAM FL | TREAD CLEARANCE 24cm', 440, 670);
            } else if (activeCam.id === 4) {
                // Front Chassis HazCam FR
                ctx.fillStyle = '#181818';
                ctx.fillRect(980, 420, 240, 300);
                ctx.strokeStyle = '#16a34a';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(1100, 570, 120, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = '#16a34a';
                ctx.font = '16px monospace';
                ctx.fillText('FRONT CHASSIS HAZCAM FR | TREAD CLEARANCE 24cm', 440, 670);
            } else if (activeCam.id === 5) {
                // Rear HazCam
                ctx.fillStyle = '#1e1b18';
                ctx.fillRect(200, 620, 880, 100);
                ctx.strokeStyle = '#84cc16';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 8]);
                ctx.beginPath();
                ctx.moveTo(350, 620); ctx.lineTo(480, 360);
                ctx.moveTo(930, 620); ctx.lineTo(800, 360);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#84cc16';
                ctx.font = '16px monospace';
                ctx.fillText('REVERSE HAZARD TRACK | NO REAR OBSTACLES', 450, 420);
            } else if (activeCam.id === 6) {
                // Manipulator Wrist
                ctx.fillStyle = '#27272a';
                ctx.fillRect(520, 450, 70, 270);
                ctx.fillRect(690, 450, 70, 270);
                ctx.strokeStyle = '#f97316';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(560, 400); ctx.lineTo(720, 400);
                ctx.moveTo(640, 320); ctx.lineTo(640, 480);
                ctx.stroke();
                ctx.fillStyle = '#f97316';
                ctx.font = '16px monospace';
                ctx.fillText('MANIPULATOR GRIPPER ALIGNMENT: 42mm APERTURE', 420, 300);
            } else if (activeCam.id === 7) {
                // Manipulator Elbow
                ctx.strokeStyle = '#ea580c';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(250, 600); ctx.lineTo(640, 350); ctx.lineTo(1000, 500);
                ctx.stroke();
                ctx.fillStyle = '#ea580c';
                ctx.font = '16px monospace';
                ctx.fillText('ELBOW OVERVIEW | SHOULDER: +42° | ELBOW: -18°', 420, 250);
            } else if (activeCam.id === 8) {
                // Science Macro
                ctx.fillStyle = '#451a03';
                ctx.fillRect(0, 0, 1280, 720);
                ctx.fillStyle = '#d97706';
                for (let i = 0; i < 60; i++) {
                    ctx.beginPath();
                    ctx.arc((i * 47) % 1280, (i * 73) % 720, (i % 8) + 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#eab308';
                ctx.font = '16px monospace';
                ctx.fillText('MACRO REGOLITH PROBING: PEAK FOCUS | 500 μm SCALE', 400, 660);
            } else if (activeCam.id === 9) {
                // Science Chamber
                ctx.fillStyle = '#252526';
                ctx.beginPath();
                ctx.arc(640, 360, 200, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = '#a855f7';
                ctx.font = '16px monospace';
                ctx.fillText('CYCLONE SAMPLING CHAMBER | TUBE #2 ACTIVE', 450, 360);
            } else if (activeCam.id === 10) {
                // Top Deck Context
                ctx.fillStyle = '#09090b';
                ctx.fillRect(0, 0, 1280, 720);
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(300, 480, 680, 240);
                ctx.strokeStyle = '#ec4899';
                ctx.lineWidth = 3;
                ctx.strokeRect(300, 480, 680, 240);
                ctx.fillStyle = '#ec4899';
                ctx.font = '16px monospace';
                ctx.fillText('TOP DECK CONTEXT 360 | SOLAR & RF MAST NOMINAL', 430, 450);
            }

            requestAnimationFrame(drawFrame);
        }

        requestAnimationFrame(drawFrame);
    </script>
</body>
