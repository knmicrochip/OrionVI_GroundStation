<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orion Rover - Camera Stream Feed</title>
    <script src="orion-camera-config.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0px !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
            background-color: #121212;
            color: #d4d4d4;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            display: flex;
            flex-direction: column;
        }

        /* Top Header & HUD */
        .camera-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #161616;
            border-bottom: 1px solid #282828;
            padding: 6px 12px;
            height: 34px;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cam-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
        }

        .cam-title {
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #f8fafc;
            text-transform: uppercase;
        }

        .cam-badge {
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #a1a1aa;
            font-size: 9px;
            font-family: monospace;
            padding: 1px 6px;
            font-weight: 700;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-telemetry {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
            font-size: 10px;
            color: #94a3b8;
        }

        .btn-hud {
            background: #1c1c1c;
            border: 1px solid #333333;
            color: #cbd5e1;
            padding: 3px 8px;
            font-size: 9px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.15s ease;
        }

        .btn-hud:hover {
            background: #282828;
            border-color: #4a4a4a;
            color: #ffffff;
        }

        .btn-hud.btn-primary {
            background: #1d4ed8;
            border-color: #2563eb;
            color: #ffffff;
        }
        .btn-hud.btn-primary:hover {
            background: #2563eb;
        }

        /* Viewport Canvas Area */
        .viewport-container {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas#camera-stream-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Overlays & Crosshairs */
        .reticle-crosshair {
            position: absolute;
            width: 36px;
            height: 36px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            pointer-events: none;
            display: block;
        }

        .reticle-crosshair::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(56, 189, 248, 0.4);
        }

        .reticle-crosshair::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            background: rgba(56, 189, 248, 0.4);
        }

        .osd-overlay {
            position: absolute;
            bottom: 12px;
            left: 14px;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #282828;
            padding: 4px 8px;
            font-family: monospace;
            font-size: 10px;
            color: #e2e8f0;
            pointer-events: none;
        }

        .osd-status {
            position: absolute;
            top: 12px;
            right: 14px;
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #282828;
            padding: 4px 8px;
            font-family: monospace;
            font-size: 9px;
            color: #38bdf8;
            pointer-events: none;
        }

        .snapshot-toast {
            position: absolute;
            top: 50px;
            right: 14px;
            background: #14532d;
            border: 1px solid #166534;
            color: #86efac;
            font-size: 10px;
            font-weight: 700;
            padding: 6px 12px;
            z-index: 50;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="camera-header">
        <div class="header-left">
            <div id="cam-live-dot" class="cam-dot"></div>
            <div id="cam-name-text" class="cam-title">AXIS 1</div>
            <div id="cam-role-badge" class="cam-badge">CAMERA 1</div>
            <select id="cam-selector" class="btn-hud" style="font-family: sans-serif; cursor: pointer; padding: 2px 4px;">
            </select>
        </div>

        <div class="header-right">
            <div class="hud-telemetry">
                <span id="hud-res">1920x1080</span>
                <span>|</span>
                <span id="hud-fps" style="color: #22c55e;">30 FPS</span>
                <span>|</span>
                <span id="hud-bitrate" style="color: #38bdf8;">12.4 Mbps</span>
            </div>
            <button id="btn-toggle-reticle" class="btn-hud">RETICLE</button>
            <button id="btn-snapshot" class="btn-hud btn-primary">📸 SNAPSHOT</button>
            <button id="btn-close" class="btn-hud" onclick="window.close()">✕ CLOSE</button>
        </div>
    </header>

    <!-- Stream Viewport -->
    <main class="viewport-container">
        <canvas id="camera-stream-canvas"></canvas>
        <div id="reticle" class="reticle-crosshair"></div>

        <!-- Center NO SIGNAL Overlay: Orion Logo + Red NO SIGNAL Label -->
        <div id="no-signal-overlay" style="position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a; z-index: 20; pointer-events: none; user-select: none;">
            <img src="/logotyp_pion_white.png" onerror="this.src='logotyp_pion_white.png'" alt="Orion VI Logo" style="width: 76px; height: 76px; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));" />
            <div style="font-family: monospace, sans-serif; font-size: 16px; font-weight: 900; letter-spacing: 3px; color: #ef4444; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.6); padding: 5px 20px; border-radius: 0px !important; text-shadow: 0 0 12px rgba(239, 68, 68, 0.6);">
                NO SIGNAL
            </div>
            <div id="no-signal-reconnect" style="font-family: monospace, sans-serif; font-size: 11px; font-weight: 700; color: #94a3b8; margin-top: 10px; letter-spacing: 0.5px;">
                Attempting reconnect in 5s...
            </div>
        </div>

        <div id="osd-info" class="osd-overlay">
            <span style="color: #71717a;">UTC:</span> <span id="osd-time">--</span> |
            <span style="color: #71717a;">CODEC:</span> H.264 LOW-LATENCY
        </div>
        <div id="osd-status" class="osd-status" style="color: #ef4444;">
            DOWNLINK: NO CARRIER (0.0% PKTS)
        </div>
        <div id="snapshot-toast" class="snapshot-toast">
            ✓ SNAPSHOT LOGGED TO NOTEBOOK
        </div>
    </main>

    <script>
        const CAMERAS = (window.OrionCameraConfig && window.OrionCameraConfig.getAllCameras)
            ? window.OrionCameraConfig.getAllCameras()
            : [
                { id: 1, key: 'cam_axis_1', alias: 'cam_mast_rgb', defaultName: 'AXIS 1', name: 'AXIS 1', short: 'AXIS 1', resolution: '1280x720', role: 'Camera 1', isAxis: true },
                { id: 2, key: 'cam_axis_2', alias: 'cam_mast_depth', defaultName: 'AXIS 2', name: 'AXIS 2', short: 'AXIS 2', resolution: '1280x720', role: 'Camera 2', isAxis: true },
                { id: 3, key: 'cam_axis_3', alias: 'cam_haz_fl', defaultName: 'AXIS 3', name: 'AXIS 3', short: 'AXIS 3', resolution: '1280x720', role: 'Camera 3', isAxis: true },
                { id: 4, key: 'cam_axis_4', alias: 'cam_haz_fr', defaultName: 'AXIS 4', name: 'AXIS 4', short: 'AXIS 4', resolution: '1280x720', role: 'Camera 4', isAxis: true },
                { id: 5, key: 'cam_laptop_test', alias: 'cam_test', defaultName: 'Laptop Webcam', name: 'Laptop Webcam', short: 'LAPTOP CAM', resolution: '1280x720', role: 'Operator Test Feed / Webcam', isTestCam: true },
                { id: 6, key: 'cam_usb_test', alias: 'cam_usb', defaultName: 'USB Camera', name: 'USB Camera', short: 'USB CAM', resolution: '1280x720', role: 'Operator Test Feed / USB', isTestCam: true }
            ];

        // Parse camera parameter from URL (?cam=1, ?cam=2, ?cam=mast, etc.)
        const params = new URLSearchParams(window.location.search);
        let camParam = (params.get('cam') || '1').toLowerCase();
        function resolveCamera(p) {
            if (p === '11' || p === 'test') return CAMERAS.find(c => c.id === 5) || CAMERAS[4];
            if (p === '12' || p === 'usb') return CAMERAS.find(c => c.id === 6) || CAMERAS[5];
            return CAMERAS.find(c => String(c.id) === p || c.key.toLowerCase() === p || (c.alias && c.alias.toLowerCase() === p) || (c.short && c.short.toLowerCase() === p) || (c.name && c.name.toLowerCase() === p)) || CAMERAS[0];
        }
        let activeCam = resolveCamera(camParam);

        const canvas = document.getElementById('camera-stream-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1280;
        canvas.height = 720;

        const titleEl = document.getElementById('cam-name-text');
        const roleEl = document.getElementById('cam-role-badge');
        const selectEl = document.getElementById('cam-selector');
        const hudRes = document.getElementById('hud-res');
        const hudFps = document.getElementById('hud-fps');
        const hudBitrate = document.getElementById('hud-bitrate');
        const osdTime = document.getElementById('osd-time');
        const reticle = document.getElementById('reticle');
        const btnReticle = document.getElementById('btn-toggle-reticle');
        const btnSnapshot = document.getElementById('btn-snapshot');
        const toast = document.getElementById('snapshot-toast');

        function populateSelector() {
            selectEl.innerHTML = '';
            CAMERAS.forEach(c => {
                const opt = document.createElement('option');
                opt.value = String(c.id);
                opt.textContent = `${c.name} (${c.resolution})`;
                selectEl.appendChild(opt);
            });
            selectEl.value = String(activeCam.id);
        }
        populateSelector();

        function setCamera(cam) {
            activeCam = cam;
            document.title = `Orion Rover - ${cam.name} Feed`;
            titleEl.textContent = cam.name.toUpperCase();
            roleEl.textContent = cam.role.toUpperCase();
            selectEl.value = String(cam.id);
            hudRes.textContent = cam.resolution;
        }

        setCamera(activeCam);

        window.addEventListener('orion-camera-renamed', (e) => {
            if (e.detail) {
                const updated = e.detail;
                if (updated.id === activeCam.id) {
                    setCamera(updated);
                }
                populateSelector();
            }
        });

        selectEl.addEventListener('change', async (e) => {
            const chosen = CAMERAS.find(c => String(c.id) === e.target.value);
            if (chosen) {
                stopWebcam();
                stopAxisStream();
                reconnectCountdown = 5;
                setCamera(chosen);
                setSignalState(false);
                if (chosen.id === 5 || chosen.id === 6 || chosen.id === 11 || chosen.id === 12) {
                    await startWebcam();
                } else if (chosen.isAxis || (chosen.id >= 1 && chosen.id <= 4)) {
                    startAxisStream(chosen.id);
                } else {
                    await scanFeed();
                }
            }
        });

        let showReticle = true;
        btnReticle.addEventListener('click', () => {
            showReticle = !showReticle;
            reticle.style.display = showReticle ? 'block' : 'none';
            btnReticle.style.borderColor = showReticle ? '#38bdf8' : '#333333';
        });

        btnSnapshot.addEventListener('click', () => {
            const cvs = document.getElementById('camera-stream-canvas');
            if (!cvs) return;
            let dataUrl;
            try {
                dataUrl = cvs.toDataURL('image/png');
            } catch (err) {
                console.warn('[Snapshot] Error getting data URL:', err);
                return;
            }

            // Create thumbnail for Notebook snapshot embed
            const thumbCvs = document.createElement('canvas');
            thumbCvs.width = 60;
            thumbCvs.height = 34;
            const tCtx = thumbCvs.getContext('2d');
            tCtx.drawImage(cvs, 0, 0, 60, 34);
            let thumbUrl;
            try {
                thumbUrl = thumbCvs.toDataURL('image/png');
            } catch (_) {
                thumbUrl = dataUrl;
            }

            const uuid = 'snap-' + Date.now() + '-' + Math.random().toString(36).substring(2, 9);
            const embedId = 'embed-' + Date.now();
            const now = Date.now();

            const snapItem = {
                notebookImageDomainObject: {
                    name: `${activeCam.name} Snapshot`,
                    type: 'notebookSnapshotImage',
                    identifier: { key: uuid, namespace: '' },
                    configuration: { fullSizeImageURL: dataUrl }
                },
                embedObject: {
                    bounds: { start: now - 300000, end: now },
                    createdOn: now,
                    createdBy: null,
                    cssClass: 'icon-imagery',
                    domainObject: {
                        identifier: { namespace: 'orion.taxonomy', key: `cam_${activeCam.id}` },
                        name: activeCam.name,
                        type: 'orion.camera_feed'
                    },
                    historicLink: `#/browse/orion.taxonomy:cam_${activeCam.id}`,
                    id: embedId,
                    name: activeCam.name,
                    snapshot: {
                        fullSizeImageObjectIdentifier: { key: uuid, namespace: '' },
                        thumbnailImage: { src: thumbUrl }
                    },
                    type: 'orion.camera_feed'
                }
            };

            let list = [];
            try {
                list = JSON.parse(localStorage.getItem('notebook-snapshot-storage') || '[]');
            } catch (_) {}
            list.unshift(snapItem);
            if (list.length > 10) list.pop();
            try {
                localStorage.setItem('notebook-snapshot-storage', JSON.stringify(list));
            } catch (e) {
                console.warn('[Snapshot Storage Error]', e);
            }

            // Trigger real PNG download to user's computer
            const a = document.createElement('a');
            a.download = `snapshot_${activeCam.short.toLowerCase().replace(/[^a-z0-9]/g, '_')}_${Date.now()}.png`;
            a.href = dataUrl;
            document.body.appendChild(a);
            a.click();
            a.remove();

            toast.textContent = `📸 SNAPSHOT SAVED TO NOTEBOOK & DOWNLOADED`;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        });

        // Signal State: 5-second grace period for NO SIGNAL background
        let hasSignal = false;
        let showNoSignalBg = false;
        let noSignalTimer = null;
        let lostSignalTime = Date.now();

        const orionLogo = new Image();
        orionLogo.src = '/logotyp_pion_white.png';

        const noSigOverlay = document.getElementById('no-signal-overlay');
        const liveDot = document.getElementById('cam-live-dot');
        const osdStatus = document.getElementById('osd-status');

        function setSignalState(sig) {
            const next = Boolean(sig);
            hasSignal = next;
            if (next) {
                // Signal established: NO SIGNAL background disappears immediately
                if (noSignalTimer) {
                    clearTimeout(noSignalTimer);
                    noSignalTimer = null;
                }
                showNoSignalBg = false;
                lostSignalTime = null;
                reconnectCountdown = 5;
            } else {
                // Signal lost: wait 5 seconds of continuous no signal before showing background
                if (!lostSignalTime) {
                    lostSignalTime = Date.now();
                }
                if (!showNoSignalBg && !noSignalTimer) {
                    noSignalTimer = setTimeout(() => {
                        noSignalTimer = null;
                        if (!hasSignal) {
                            showNoSignalBg = true;
                            updateSignalUI();
                        }
                    }, 5000);
                }
            }
            updateSignalUI();
        }

        function updateSignalUI() {
            noSigOverlay.style.display = showNoSignalBg ? 'flex' : 'none';
            liveDot.style.background = hasSignal ? '#22c55e' : (showNoSignalBg ? '#ef4444' : '#f59e0b');
            hudFps.textContent = hasSignal ? '30 FPS' : '0 FPS';
            hudFps.style.color = hasSignal ? '#22c55e' : (showNoSignalBg ? '#ef4444' : '#f59e0b');
            hudBitrate.textContent = hasSignal ? '12.4 Mbps' : '0.0 Mbps';
            hudBitrate.style.color = hasSignal ? '#38bdf8' : '#71717a';
            osdStatus.textContent = hasSignal ? 'DOWNLINK: NOMINAL (99.8% PKTS)' : (showNoSignalBg ? 'DOWNLINK: NO CARRIER (0.0% PKTS)' : 'DOWNLINK: ACQUIRING CARRIER...');
            osdStatus.style.color = hasSignal ? '#38bdf8' : (showNoSignalBg ? '#ef4444' : '#f59e0b');
        }

        // On initial startup, schedule NO SIGNAL background to appear after 5s if still disconnected
        setSignalState(false);

        function isUsbCamera(device) {
            if (!device) return false;
            const label = (device.label || '').toLowerCase();
            return /usb|logi|c270|c920|c922|c310|brio|streamcam|meet|external|uvc|camlink|capture|plug|obs/i.test(label);
        }

        function isLaptopCamera(device) {
            if (!device) return false;
            const label = (device.label || '').toLowerCase();
            if (isUsbCamera(device)) return false;
            return /integrated|internal|built-in|builtin|facetime|embedded/i.test(label) ||
                   (/front|laptop/i.test(label) && !/usb|external|logi/i.test(label));
        }

        // Query and separate physical camera devices into Laptop Webcam and external USB Camera
        async function enumerateCameraDevices() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                return { laptopDevice: null, usbDevice: null };
            }
            try {
                let devices = await navigator.mediaDevices.enumerateDevices();
                let videoInputs = devices.filter(d => d.kind === 'videoinput');

                // If labels are empty (happens before initial getUserMedia), probe briefly
                if (videoInputs.length > 0 && videoInputs.some(d => !d.label)) {
                    try {
                        const probe = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                        probe.getTracks().forEach(t => { try { t.stop(); } catch(_) {} });
                        devices = await navigator.mediaDevices.enumerateDevices();
                        videoInputs = devices.filter(d => d.kind === 'videoinput');
                    } catch (_) {}
                }

                if (videoInputs.length === 0) return { laptopDevice: null, usbDevice: null };

                let laptop = videoInputs.find(d => isLaptopCamera(d)) || null;
                let usb = videoInputs.find(d => isUsbCamera(d)) || null;

                if (videoInputs.length === 1) {
                    const single = videoInputs[0];
                    if (isUsbCamera(single)) {
                        return { laptopDevice: null, usbDevice: single };
                    } else if (isLaptopCamera(single)) {
                        return { laptopDevice: single, usbDevice: null };
                    } else {
                        return { laptopDevice: single, usbDevice: null };
                    }
                }

                if (!laptop && usb) {
                    laptop = videoInputs.find(d => d.deviceId !== usb.deviceId) || null;
                } else if (laptop && !usb) {
                    usb = videoInputs.find(d => d.deviceId !== laptop.deviceId) || null;
                } else if (!laptop && !usb && videoInputs.length >= 2) {
                    laptop = videoInputs[0];
                    usb = videoInputs[1];
                }

                // Strictly forbid same deviceId
                if (laptop && usb && laptop.deviceId === usb.deviceId) {
                    usb = null;
                }

                return { laptopDevice: laptop || null, usbDevice: usb || null };
            } catch (e) {
                return { laptopDevice: null, usbDevice: null };
            }
        }

        // Webcam stream service for standalone popout window
        let webcamStream = null;
        let webcamVideo = null;
        let isWebcamActive = false;

        function hasLiveTrack() {
            if (!webcamStream) return false;
            const tracks = webcamStream.getVideoTracks();
            if (!tracks || tracks.length === 0) return false;
            return tracks.some(t => t.readyState === 'live' && t.enabled);
        }

        async function startWebcam() {
            if (isWebcamActive && webcamVideo && webcamVideo.readyState >= 2 && hasLiveTrack()) return true;
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('getUserMedia not supported');
                }

                const { laptopDevice, usbDevice } = await enumerateCameraDevices();
                const targetDevice = (activeCam.id === 6 || activeCam.id === 12) ? usbDevice : laptopDevice;

                if (!targetDevice || !targetDevice.deviceId) {
                    throw new Error((activeCam.id === 6 || activeCam.id === 12) ? 'External USB camera not detected (connect USB camera)' : 'Laptop webcam not detected');
                }

                if (webcamStream) {
                    webcamStream.getTracks().forEach(t => { try { t.stop(); } catch(_) {} });
                    webcamStream = null;
                }

                const constraints = {
                    video: {
                        deviceId: { exact: targetDevice.deviceId },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                webcamStream = stream;

                const tracks = stream.getVideoTracks();
                tracks.forEach(track => {
                    const onEnded = () => {
                        console.warn('[Webcam Popout] Track onended fired!');
                        stopWebcam();
                    };
                    track.onended = onEnded;
                    track.addEventListener('ended', onEnded);
                });

                const v = document.createElement('video');
                v.setAttribute('playsinline', 'true');
                v.setAttribute('autoplay', 'true');
                v.muted = true;
                v.srcObject = stream;
                await new Promise(r => {
                    v.onloadedmetadata = () => { v.play().then(r).catch(r); };
                    setTimeout(r, 1200);
                });
                webcamVideo = v;
                isWebcamActive = true;
                hasSignal = true;
                reconnectCountdown = 5;
                updateSignalUI();
                return true;
            } catch (err) {
                console.warn('[Webcam Popout] Camera unavailable:', err.message || err);
                isWebcamActive = false;
                hasSignal = false;
                if (webcamStream) {
                    webcamStream.getTracks().forEach(t => { try { t.stop(); } catch(_) {} });
                    webcamStream = null;
                }
                webcamVideo = null;
                updateSignalUI();
                return false;
            }
        }

        function stopWebcam() {
            if (webcamStream) {
                webcamStream.getTracks().forEach(t => { try { t.stop(); } catch(_) {} });
                webcamStream = null;
            }
            if (webcamVideo) {
                try { webcamVideo.pause(); webcamVideo.srcObject = null; } catch(_) {}
                webcamVideo = null;
            }
            isWebcamActive = false;
            reconnectCountdown = 5;
            setSignalState(false);
        }

        // AXIS Network Camera Stream Handler
        let axisImg = null;
        let isAxisActive = false;

        function startAxisStream(camId) {
            stopAxisStream();
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                isAxisActive = true;
                reconnectCountdown = 5;
                setSignalState(true);
            };
            img.onerror = () => {
                isAxisActive = false;
                setSignalState(false);
            };
            img.src = `/api/camera/axis/${camId}/stream?t=${Date.now()}&force=true&reconnect=${Math.random().toString(36).substring(2, 9)}`;
            axisImg = img;
        }

        function forceReconnectAxisStream(camId) {
            startAxisStream(camId);
        }

        function stopAxisStream() {
            if (axisImg) {
                axisImg.onload = null;
                axisImg.onerror = null;
                axisImg.src = '';
                axisImg = null;
            }
            isAxisActive = false;
        }

        if (activeCam.isAxis || (activeCam.id >= 1 && activeCam.id <= 4)) {
            startAxisStream(activeCam.id);
        } else if (activeCam.id === 5 || activeCam.id === 6 || activeCam.id === 11 || activeCam.id === 12) {
            startWebcam().catch(() => {});
        }

        // Listen for hardware plug/unplug events
        if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
            navigator.mediaDevices.addEventListener('devicechange', async () => {
                const { laptopDevice, usbDevice } = await enumerateCameraDevices();
                const targetDevice = (activeCam.id === 6 || activeCam.id === 12) ? usbDevice : laptopDevice;
                if (targetDevice) {
                    if (!isWebcamActive || !hasLiveTrack()) {
                        console.log('[Webcam Popout] Target device detected, starting...');
                        await startWebcam();
                    }
                } else {
                    if (isWebcamActive) {
                        console.warn('[Webcam Popout] Target device removed, stopping...');
                        stopWebcam();
                    }
                }
            });
        }

        // Reconnect countdown and scan timer
        let reconnectCountdown = 5;
        const reconnectEl = document.getElementById('no-signal-reconnect');

        let lastWebcamCurTime = -1;
        let lastWebcamFrames = -1;
        let lastWebcamProgressionTime = 0;

        function checkWebcamFrozen() {
            if (!webcamVideo || !isWebcamActive) return false;
            const curTime = webcamVideo.currentTime;
            const quality = (typeof webcamVideo.getVideoPlaybackQuality === 'function') ? webcamVideo.getVideoPlaybackQuality() : null;
            const frames = quality ? quality.totalVideoFrames : null;
            const now = Date.now();

            if (!lastWebcamProgressionTime) {
                lastWebcamProgressionTime = now;
                lastWebcamCurTime = curTime;
                lastWebcamFrames = frames;
                return false;
            }

            const advanced = (curTime !== lastWebcamCurTime) || (frames !== null && frames !== lastWebcamFrames);
            if (advanced) {
                lastWebcamProgressionTime = now;
                lastWebcamCurTime = curTime;
                lastWebcamFrames = frames;
                return false;
            }

            if ((now - lastWebcamProgressionTime) >= 5000) {
                return true;
            }
            return false;
        }

        async function scanFeed() {
            if (hasSignal) return;
            if (activeCam.id === 5 || activeCam.id === 6 || activeCam.id === 11 || activeCam.id === 12) {
                const ok = await startWebcam();
                if (ok) {
                    reconnectCountdown = 5;
                }
                return;
            }
            if (activeCam.isAxis || (activeCam.id >= 1 && activeCam.id <= 4)) {
                try {
                    const res = await fetch(`/api/camera/axis/${activeCam.id}/feed_status?force=true`).catch(() => null);
                    if (res && res.ok) {
                        const data = await res.json();
                        if (data && data.online) {
                            isAxisActive = true;
                            reconnectCountdown = 5;
                            setSignalState(true);
                            forceReconnectAxisStream(activeCam.id);
                        }
                    }
                } catch (_) {}
                return;
            }
            try {
                const res = await fetch(`/api/camera/${activeCam.id}/feed_status`).catch(() => null);
                if (res && res.ok) {
                    const data = await res.json();
                    if (data && data.online) {
                        reconnectCountdown = 5;
                        setSignalState(true);
                    }
                }
            } catch (_) {}
        }

        setInterval(async () => {
            // 1. Check if active camera stream has frozen (>5s without new stream frames)
            if (hasSignal) {
                if (activeCam.isAxis || (activeCam.id >= 1 && activeCam.id <= 4)) {
                    window._lastPopoutAxisCheck = window._lastPopoutAxisCheck || 0;
                    const now = Date.now();
                    if (now - window._lastPopoutAxisCheck >= 2500) {
                        window._lastPopoutAxisCheck = now;
                        try {
                            const controller = new AbortController();
                            const timer = setTimeout(() => controller.abort(), 3000);
                            const res = await fetch(`/api/camera/axis/${activeCam.id}/feed_status`, { signal: controller.signal }).catch(() => null);
                            clearTimeout(timer);
                            if (!res || !res.ok) {
                                console.warn('[Camera Popout] AXIS status check failed, stream marked frozen/lost');
                                isAxisActive = false;
                                setSignalState(false);
                            } else {
                                const data = await res.json();
                                if (!data.online) {
                                    console.warn('[Camera Popout] AXIS stream FROZEN (>5s no frames). Triggering reset & 5s countdown.');
                                    isAxisActive = false;
                                    setSignalState(false);
                                }
                            }
                        } catch (_) {}
                    }
                } else if (isWebcamActive && webcamVideo) {
                    if (!hasLiveTrack() || (webcamStream && webcamStream.getVideoTracks()[0].readyState === 'ended')) {
                        console.warn('[Camera Popout] Live track ended in interval check');
                        stopWebcam();
                        setSignalState(false);
                    } else if (checkWebcamFrozen()) {
                        console.warn('[Camera Popout] Webcam stream FROZEN (>5s no frames). Triggering reset & 5s countdown.');
                        stopWebcam();
                        setSignalState(false);
                    }
                }
            }

            // 2. Countdown decrement and FORCE RECONNECT loop (repeating every 5s until successful)
            if (!hasSignal) {
                if (reconnectCountdown <= 0) {
                    reconnectCountdown = 5;
                } else {
                    reconnectCountdown--;
                }

                if (reconnectEl) {
                    reconnectEl.textContent = `Attempting reconnect in ${reconnectCountdown}s...`;
                }

                // Each time 5s countdown is complete (reaches 0), app MUST FORCE RECONNECT
                if (reconnectCountdown === 0) {
                    console.log(`[Camera Popout] 5s countdown complete for Camera ${activeCam.id} -> FORCING RECONNECT`);
                    if (activeCam.isAxis || (activeCam.id >= 1 && activeCam.id <= 4)) {
                        forceReconnectAxisStream(activeCam.id);
                        scanFeed();
                    } else if (activeCam.id === 5 || activeCam.id === 6 || activeCam.id === 11 || activeCam.id === 12) {
                        stopWebcam();
                        startWebcam();
                    } else {
                        scanFeed();
                    }
                    // Reset countdown so it repeats every 5s until successful
                    reconnectCountdown = 5;
                }
            }
        }, 1000);

        // Rendering loop: NO SIM MODES!
        function drawFrame() {
            const now = Date.now();
            osdTime.textContent = new Date(now).toISOString();

            if (isAxisActive && axisImg && axisImg.naturalWidth > 0) {
                ctx.drawImage(axisImg, 0, 0, 1280, 720);

                // Top pill badge
                ctx.fillStyle = 'rgba(8, 47, 73, 0.85)';
                ctx.fillRect(640 - 115, 12, 230, 22);
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 1;
                ctx.strokeRect(640 - 115, 12, 230, 22);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 10px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`● LIVE ${activeCam.name.toUpperCase()}`, 640, 23);

                // Center Reticle Crosshair
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(640 - 30, 360); ctx.lineTo(640 - 8, 360);
                ctx.moveTo(640 + 8, 360); ctx.lineTo(640 + 30, 360);
                ctx.moveTo(640, 360 - 30); ctx.lineTo(640, 360 - 8);
                ctx.moveTo(640, 360 + 8); ctx.lineTo(640, 360 + 30);
                ctx.stroke();

                requestAnimationFrame(drawFrame);
                return;
            }

            if (isWebcamActive && webcamVideo && webcamVideo.readyState >= 2) {
                ctx.drawImage(webcamVideo, 0, 0, 1280, 720);

                // Top pill badge
                const isUsb = activeCam.id === 6 || activeCam.id === 12;
                ctx.fillStyle = isUsb ? 'rgba(8, 51, 68, 0.85)' : 'rgba(6, 78, 59, 0.85)';
                ctx.fillRect(640 - 105, 12, 210, 22);
                ctx.strokeStyle = isUsb ? '#06b6d4' : '#10b981';
                ctx.lineWidth = 1;
                ctx.strokeRect(640 - 105, 12, 210, 22);
                ctx.fillStyle = isUsb ? '#67e8f9' : '#6ee7b7';
                ctx.font = 'bold 10px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(isUsb ? '● LIVE USB CAMERA' : '● LIVE LAPTOP WEBCAM', 640, 23);

                // Center Reticle Crosshair
                ctx.strokeStyle = isUsb ? 'rgba(6, 182, 212, 0.4)' : 'rgba(16, 185, 129, 0.4)';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(640 - 30, 360); ctx.lineTo(640 - 8, 360);
                ctx.moveTo(640 + 8, 360); ctx.lineTo(640 + 30, 360);
                ctx.moveTo(640, 360 - 30); ctx.lineTo(640, 360 - 8);
                ctx.moveTo(640, 360 + 8); ctx.lineTo(640, 360 + 30);
                ctx.stroke();

                requestAnimationFrame(drawFrame);
                return;
            }

            // Standby Scene: Only render Orion Logo and NO SIGNAL badge after 5s grace period has elapsed!
            if (showNoSignalBg) {
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, 1280, 720);

                ctx.strokeStyle = '#181818';
                ctx.lineWidth = 1;
                for (let x = 0; x < 1280; x += 40) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 720); ctx.stroke();
                }
                for (let y = 0; y < 720; y += 40) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1280, y); ctx.stroke();
                }

                if (orionLogo.complete && orionLogo.naturalWidth > 0) {
                    ctx.drawImage(orionLogo, 640 - 50, 360 - 90, 100, 100);
                }

                // Red NO SIGNAL badge box
                ctx.fillStyle = 'rgba(239, 68, 68, 0.12)';
                ctx.fillRect(640 - 90, 360 + 24, 180, 32);
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
                ctx.lineWidth = 1.2;
                ctx.strokeRect(640 - 90, 360 + 24, 180, 32);

                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 16px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('NO SIGNAL', 640, 360 + 40);

                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 12px monospace';
                ctx.fillText(`Attempting reconnect in ${reconnectCountdown}s...`, 640, 360 + 74);
            } else if (axisImg && axisImg.complete && axisImg.naturalWidth > 0) {
                // Within 5s grace period: keep displaying last known frame
                ctx.drawImage(axisImg, 0, 0, 1280, 720);
            } else {
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, 1280, 720);
            }

            requestAnimationFrame(drawFrame);
        }

        requestAnimationFrame(drawFrame);
    </script>
</body>
</html>
