    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Safeguard against unhandled DOMExceptions during PreviewContainer view unmount/restoration
        const _origAppendChild = Node.prototype.appendChild;
        Node.prototype.appendChild = function (child) {
            try {
                return _origAppendChild.call(this, child);
            } catch (err) {
                if (err && (err.name === 'NotFoundError' || err.name === 'HierarchyRequestError' || (err.message && err.message.includes('Node')))) {
                    console.warn('[OpenMCT DOM Safeguard] Handled appendChild restoration gracefully:', err.message);
                    return child;
                }
                throw err;
            }
        };

        openmct.setAssetPath('node_modules/openmct/dist');

        // Core Infrastructure Plugins
        openmct.install(openmct.plugins.LocalStorage());
        openmct.install(openmct.plugins.MyItems());
        openmct.install(openmct.plugins.UTCTimeSystem());
        openmct.install(openmct.plugins.Espresso());

        // Standard Open MCT Object Creation & Visualization Plugins
        if (typeof openmct.plugins.Plot === 'function') {
            try { openmct.install(openmct.plugins.Plot()); } catch (_) {}
        }
        if (typeof openmct.plugins.TelemetryTable === 'function') {
            try { openmct.install(openmct.plugins.TelemetryTable()); } catch (_) {}
        }
        if (typeof openmct.plugins.LADTable === 'function') {

        if (typeof openmct.plugins.DisplayLayout === 'function') {

        if (typeof openmct.plugins.FlexibleLayout === 'function') {
            try { openmct.install(openmct.plugins.FlexibleLayout()); } catch (_) {}
        }
        if (typeof openmct.plugins.Tabs === 'function') {
            try { openmct.install(openmct.plugins.Tabs()); } catch (_) {}
        }
        if (typeof openmct.plugins.SummaryWidget === 'function') {
            try { openmct.install(openmct.plugins.SummaryWidget()); } catch (_) {}
        }
        if (typeof openmct.plugins.Notebook === 'function') {
            try { openmct.install(openmct.plugins.Notebook()); } catch (_) {}
        }
        if (typeof openmct.plugins.Condition === 'function') {
            try { openmct.install(openmct.plugins.Condition()); } catch (_) {}
        }
        if (typeof openmct.plugins.ConditionWidget === 'function') {
            try { openmct.install(openmct.plugins.ConditionWidget()); } catch (_) {}
        }
        if (typeof openmct.plugins.Gauge === 'function') {
            try { openmct.install(openmct.plugins.Gauge()); } catch (_) {}
        }
        if (typeof openmct.plugins.NewFolderAction === 'function') {

        if (typeof openmct.plugins.ScatterPlot === 'function') {
            try { openmct.install(openmct.plugins.ScatterPlot()); } catch (_) {}
        }
        if (typeof openmct.plugins.Clock === 'function') {
            try { openmct.install(openmct.plugins.Clock({ enableClockIndicator: true })); } catch (_) {}
        }
        if (typeof openmct.plugins.Timer === 'function') {
            try { openmct.install(openmct.plugins.Timer()); } catch (_) {}
        }
        if (typeof openmct.plugins.Filters === 'function') {
            try { openmct.install(openmct.plugins.Filters(['table', 'telemetry.plot.overlay'])); } catch (_) {}
        }
        if (typeof openmct.plugins.PlanLayout === 'function') {
            try { openmct.install(openmct.plugins.PlanLayout({ creatable: true })); } catch (e) { console.warn('[Open MCT] PlanLayout install error:', e); }
        }
        if (typeof openmct.plugins.Timeline === 'function') {
            try { openmct.install(openmct.plugins.Timeline()); } catch (e) { console.warn('[Open MCT] Timeline install error:', e); }
        }
        if (typeof openmct.plugins.Timelist === 'function') {
            try { openmct.install(openmct.plugins.Timelist()); } catch (e) { console.warn('[Open MCT] Timelist install error:', e); }
        }

        // Install Orion Task Clock & Timeline Engine (registers MET time system, format and met-clock)
        openmct.install(OrionTaskClockPlugin());

        // Time Conductor Configuration: All graphs, displays, tables, and logs run on UTC Real Time Clock; MET options available for task timelines
        if (typeof openmct.plugins.Conductor === 'function') {
            openmct.install(openmct.plugins.Conductor({
                menuOptions: [
                    {
                        name: "Realtime (UTC)",
                        timeSystem: "utc",
                        clock: "local",
                        clockOffsets: {
                            start: -30 * 60 * 1000,
                            end: 30 * 1000
                        }
                    },
                    {
                        name: "Fixed (UTC)",
                        timeSystem: "utc",
                        bounds: {
                            subFormat: "YYYY-MM-DD",
                            start: Date.now() - 30 * 60 * 1000,
                            end: Date.now()
                        }
                    },
                    {
                        name: "Realtime (MET)",
                        timeSystem: "met",
                        clock: "met-clock",
                        clockOffsets: {
                            start: 0,
                            end: 2100 * 1000
                        }
                    },
                    {
                        name: "Fixed (MET)",
                        timeSystem: "met",
                        bounds: {
                            start: 0,
                            end: 2100 * 1000
                        }
                    }
                ]
            }));
        }

        // Real Time Clock Initialization: All graphs, telemetry displays, tables, and logs run on UTC Realtime
        openmct.time.setTimeSystem('utc');
        openmct.time.setClock('local');

        if (typeof openmct.branding === 'function') {

                        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 4px;">Mission Control & Telemetry System | KN MicroChip | ERC 2026</p>
                        <p style="color: #64748b; font-size: 11px; font-family: monospace;">20V 4Ah Power Bus (5S Li-ion) | 5GHz Wi-Fi Telemetry</p>
                    </div>
                `

        // Install Orion VI Taxonomy & Normalized Telemetry Providers
        openmct.install(OrionDictionaryPlugin());

        // Install Teleoperation, Gamepad & Perception Plugins
        openmct.install(OrionGamepadPlugin());
        openmct.install(OrionCameraMosaicPlugin());
        openmct.install(OrionAttitudeIndicatorPlugin());

        // Install Power & Safety Plugins
        openmct.install(OrionPowerStripPlugin());
        openmct.install(OrionSafetyChainPlugin());

        // Install Actuation Plugins (Science & Manipulator)
        openmct.install(OrionSciencePadPlugin());
        openmct.install(OrionManipulatorPadPlugin());

        // Install NASA / ECSS Exception & Status Widgets Plugin
        openmct.install(OrionStatusWidgetsPlugin());

        // Install Rover MQTT Live System Logs Plugin
        openmct.install(OrionLogConsolePlugin());

        // Install Operating Modes & Layouts
        openmct.install(OrionModesPlugin());

        // Install Diagnostic Upper Panel Plugins (Battery & 5GHz Antenna)
        openmct.install(OrionBatteryPlugin({
            brokerUrl: 'ws://localhost:9001',
            topic: 'Power/#',
            enableOnScreenGraph: false
        }));

        openmct.install(OrionAntennaPlugin({
            brokerUrl: 'ws://localhost:9001',
            topic: 'rover/antenna/#'
        }));

        // Install Orion 3D Model View Plugin
        openmct.install(OrionModelPlugin({
            modelUrl: '/orion_VI.glb',
            THREE: THREE,
            GLTFLoader: GLTFLoader,
            OrbitControls: OrbitControls
        }));

        function startApp() {
            const appEl = document.getElementById('app') || document.getElementById('openmct-app');
            openmct.start(appEl);
            // Default view: Native Open MCT OPERATING MODES Tabs view
            if (!window.location.hash || window.location.hash === '#/' || window.location.hash === '#/browse') {
                window.location.hash = '#/browse/orion.taxonomy:modes_tab';
            }

            // Global close button handler: guarantees closing any expanded view, Large View, modal or overlay safely without double-dismissing
            document.addEventListener('click', function (event) {
                const closeBtn = event.target.closest('.c-overlay .c-overlay__close-button, .l-overlay-wrapper .c-overlay__close-button, .c-overlay button[aria-label="Close"], .l-overlay-wrapper button[aria-label="Close"], .c-overlay .icon-x, .l-overlay-wrapper .icon-x, .js-overlay-close');
                if (closeBtn) {
                    setTimeout(() => {
                        const wrappers = document.querySelectorAll('.l-overlay-wrapper');
                        if (wrappers.length > 0 && (!window.openmct || !window.openmct.overlays || !window.openmct.overlays.activeOverlays || window.openmct.overlays.activeOverlays.length === 0)) {
                            wrappers.forEach(w => w.remove());
                        }
                    }, 80);
                }
            }, false);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startApp);
        } else {
            startApp();
        }
    </script>
</head>
<body>
    <div id="app"></div>
</body>
</html>
